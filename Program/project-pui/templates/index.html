<!DOCTYPE html>
<html>
<head>
    <title>Prediksi Penjualan UMKM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">📊 Sistem Prediksi Penjualan UMKM</h2>

    <div class="card p-4 shadow">
        <form action="/predict" method="post">
            <div class="mb-3">
                <label>Harga Produk</label>
                <input type="number" name="harga" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Promosi (0 / 1)</label>
                <input type="number" name="promosi" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100">Prediksi</button>
        </form>
    </div>

    {% if hasil %}
    <div class="card mt-4 shadow text-center">
        <div class="card-body">
            <h5>Hasil Prediksi</h5>
            <h2 class="text-success">{{ hasil }}</h2>
            <p>Estimasi jumlah penjualan</p>
        </div>
    </div>

    <div class="card mt-4 shadow p-3">
        <h5 class="text-center">Grafik Penjualan</h5>
        <canvas id="chart"></canvas>
    </div>
    {% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% if hasil %}
<script>
var ctx = document.getElementById('chart').getContext('2d');

var chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: {{ labels|tojson }},
        datasets: [{
            label: 'Penjualan',
            data: {{ values|tojson }},
            borderWidth: 2
        }]
    }
});
</script>
{% endif %}

</body>
</html>
